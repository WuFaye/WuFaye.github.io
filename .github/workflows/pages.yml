name: Deploy Hexo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate migrated source
        shell: bash
        run: |
          post_count=$(find source/_posts -type f -name '*.md' | wc -l)
          if [ "$post_count" -lt 20 ]; then
            echo "Only $post_count source posts found. Refusing to deploy an incomplete Hexo migration."
            exit 1
          fi

      - name: Install NexT theme
        run: |
          rm -rf themes/next
          git clone --depth 1 https://github.com/next-theme/hexo-theme-next.git themes/next
          git -C themes/next fetch --depth 1 origin b062274e94d232ce05dded1a4965ceb63cf60d70
          git -C themes/next checkout b062274e94d232ce05dded1a4965ceb63cf60d70

      - name: Build
        run: |
          npm run clean
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
